name: Playwright regression
on: [push, pull_request]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out automation repository
        uses: actions/checkout@v4
      - name: Check out application repository beside automation
        uses: actions/checkout@v4
        with:
          repository: fetachino/java-application-support-lab
          path: java-application-support-lab
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install automation dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start Spring Boot application
        working-directory: java-application-support-lab
        run: |
          mvn -B -DskipTests package
          nohup java -jar target/*.jar > ../application.log 2>&1 &
          echo $! > ../application.pid
      - name: Wait for application readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:8080/tickets > /dev/null; then exit 0; fi
            if ! kill -0 "$(cat application.pid)" 2>/dev/null; then cat application.log; exit 1; fi
            sleep 2
          done
          cat application.log
          exit 1
      - name: Type-check framework
        run: npm run typecheck
      - name: Run sequential regression suite
        run: npm run test:regression
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload failure evidence and Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-results/
            allure-results/
            application.log
          if-no-files-found: ignore
      - name: Stop application
        if: always()
        shell: bash
        run: if [[ -f application.pid ]]; then kill "$(cat application.pid)" 2>/dev/null || true; fi
